services:

  redis:
    image: redis:8-alpine
    container_name: rate-limiter-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build: .
    container_name: rate-limiter-api
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_ALGORITHM: ${RATE_LIMIT_ALGORITHM:-fixed}
    depends_on:
      - redis
    restart: unless-stopped